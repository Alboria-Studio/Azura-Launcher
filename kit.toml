linux-amd64 = "e568d10cc4b3c0baacc8bff9078bf1b88ef581a162d5d554abf37499fab9d2db"
win-amd64 = "51e0e56d48b6dc475683797b91f3f69bb673a5d1c92d659f5b33c02c62f4bd9d"
