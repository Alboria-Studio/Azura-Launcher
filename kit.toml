# The player kit every launcher release bundles: what the launcher needs to build the game on a
# player's machine (the runtime's compiled code and the commands to link it). It is proprietary
# and lives in the private Azura runtime repository, whose "Publish kit" workflow builds it for a
# launcher version and uploads it to https://updates.alboria.org/kits/<revision>/azura-kit-<platform>.tar.gz,
# with these lines at https://updates.alboria.org/kits/versions/<version>.toml. This repository's
# "Pin kit" workflow, run on a release branch, asks for the kit and writes them here
# (alboria-notes:release-kits.md). scripts/fetch-kit.sh downloads the pinned kit and checks it
# against these hashes. `version` is the launcher release the kit was built for (none for kits
# published before kit versions existed).
revision = "adeba09"

